<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%">
  <style>
    /* ⚡ 회로 라인 떴다 사라졌다 애니메이션 1 */
    @keyframes circuitPulse1 {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.55; }
    }
    
    /* ⚡ 회로 라인 떴다 사라졌다 애니메이션 2 (교차 동작) */
    @keyframes circuitPulse2 {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.08; }
    }
    
    /* 💡 접점 패드 동그라미 네온 깜빡임 효과 */
    @keyframes dotBlink {
      0%, 100% { opacity: 0.2; r: 3.5px; }
      50% { opacity: 0.9; r: 5.5px; }
    }

    .line-group-1 { animation: circuitPulse1 4s infinite ease-in-out; }
    .line-group-2 { animation: circuitPulse2 4s infinite ease-in-out; }
    .dot-1 { animation: dotBlink 3s infinite ease-in-out; }
    .dot-2 { animation: dotBlink 3s infinite ease-in-out; animation-delay: 1.5s; }
  </style>

  <rect width="1200" height="220" fill="#E9D5FF" rx="8" />

  <g class="line-group-1" stroke="#7C3AED" stroke-width="1.8" fill="none">
    <path d="M 0,50 L 160,50 L 210,100 L 420,100" />
    <path d="M 950,0 L 870,80 L 680,80" />
    <path d="M 120,190 L 220,190 L 250,160" />
  </g>

  <g class="line-group-2" stroke="#7C3AED" stroke-width="1.8" fill="none">
    <path d="M 1200,170 L 1040,170 L 990,120 L 780,120" />
    <path d="M 250,220 L 330,140 L 520,140" />
    <path d="M 1080,30 L 980,30 L 950,60" />
  </g>

  <g fill="#6D28D9">
    <circle class="dot-1" cx="160" cy="50" />
    <circle class="dot-1" cx="210" cy="100" />
    <circle class="dot-2" cx="1040" cy="170" />
    <circle class="dot-2" cx="990" cy="120" />
    <circle class="dot-1" cx="330" cy="140" />
    <circle class="dot-2" cx="870" cy="80" />
  </g>

  <g stroke="#7C3AED" stroke-width="2" opacity="0.35" fill="none">
    <path d="M 25,45 L 25,25 L 45,25" />
    <path d="M 1175,45 L 1175,25 L 1155,25" />
    <path d="M 25,175 L 25,195 L 45,195" />
    <path d="M 1175,175 L 1175,195 L 1155,195" />
  </g>

  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#3B0764" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="6">
    Yani-Studio Lab
  </text>
</svg>
